name: Bug report
description: Report something that isn't working as intended.
title: "[Bug]: "
labels: ["type: bug"]
body:
    - type: textarea
      id: summary
      attributes:
          label: Description
          description: What's the problem?
      validations:
          required: true

    - type: textarea
      id: reproduction
      attributes:
          label: Steps to reproduce
          placeholder: |
              1. Open...
              2. Click...
              3. Observe...
      validations:
          required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
      validations:
          required: true

    - type: textarea
      id: actual
      attributes:
          label: Actual behavior
      validations:
          required: true

    - type: textarea
      id: environment
      attributes:
          label: Environment
          description: Browser, OS, Spline version, etc.
      validations:
          required: false

    - type: textarea
      id: additional
      attributes:
          label: Additional context
          description: Screenshots, logs, or other relevant information.
      validations:
          required: false
